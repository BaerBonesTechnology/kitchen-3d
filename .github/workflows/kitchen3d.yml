name: Kitchen 3D builds

on:
  push:
    branches: [kitchen3d-5.3]
    tags: ['kitchen3d-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a downloadable preview after all platforms pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kitchen3d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  build:
    name: Build and test ${{ matrix.platform }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            library: windows_x64
          - platform: linux-x64
            runner: ubuntu-24.04
            library: linux_x64
          - platform: macos-arm64
            runner: macos-15
            library: macos_arm64
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: kitchen3d-v1-${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Identify pinned downloads
        id: download-keys
        run: python build_files/kitchen3d/cache_keys.py --library ${{ matrix.library }} >> "$GITHUB_OUTPUT"
      - name: Restore source download cache
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/lfs/objects
          key: source-lfs-v1-${{ runner.os }}-${{ steps.download-keys.outputs.source }}
          restore-keys: source-lfs-v1-${{ runner.os }}-
      - name: Restore source assets
        run: |
          git lfs install --local
          python build_files/kitchen3d/restore_lfs.py --upstream https://projects.blender.org/blender/blender --media-branch blender-v5.3-release --exclude-tests
      - name: Save source download cache
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/lfs/objects
          key: source-lfs-v1-${{ runner.os }}-${{ steps.download-keys.outputs.source }}
      - name: Check out pinned platform library pointers
        run: python build_files/kitchen3d/retry_download.py -- git submodule update --init --checkout --depth 1 -- lib/${{ matrix.library }}
      - name: Restore library download cache
        id: library-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/modules/lib/${{ matrix.library }}/lfs/objects
          key: library-lfs-v1-${{ matrix.library }}-${{ steps.download-keys.outputs.library }}
          restore-keys: library-lfs-v1-${{ matrix.library }}-
      - name: Restore platform library contents
        run: python build_files/kitchen3d/restore_lfs.py --repo lib/${{ matrix.library }} --upstream https://projects.blender.org/blender/lib-${{ matrix.library }}
      - name: Save library download cache
        if: steps.library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/modules/lib/${{ matrix.library }}/lfs/objects
          key: library-lfs-v1-${{ matrix.library }}-${{ steps.download-keys.outputs.library }}
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libegl-dev libwayland-dev libxkbcommon-dev libjack-jackd2-dev libpulse-dev libdbus-1-dev
          printf 'CC=gcc-14\nCXX=g++-14\n' >> "$GITHUB_ENV"
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          'PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','WindowsSdkDir','VCINSTALLDIR','VSINSTALLDIR' | ForEach-Object {
            "$($_)=$([Environment]::GetEnvironmentVariable($_))" >> $env:GITHUB_ENV
          }
      - name: Install compiler cache
        id: compiler-cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - name: Install NVIDIA kernel compiler
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@b6fc3a9f3f15256d9d94ffe1254f9c5a2565cde6 # v0.2.30
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc", "cudart"]'
      - name: Restore pinned OptiX headers
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/optix-dev
          ref: fff65c2a7c592f1ea5f1661ad7d2381cf965f9bd # v9.0.0
          path: .ci/optix
          persist-credentials: false
      - name: Verify CUDA compiler cache reuse
        if: runner.os == 'Windows'
        run: python tests/python/kitchen3d_cuda_cache.py
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -C build_files/kitchen3d/ci.cmake \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DOPTIX_ROOT_DIR="$PWD/.ci/optix" \
            -DCYCLES_CUDA_COMPILER_LAUNCHER=sccache \
            -DTEST_PYTHON_EXE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build and install
        run: cmake --build build --target install --parallel 3
      - name: Report compiler cache statistics
        if: always() && steps.compiler-cache.outcome == 'success'
        run: sccache --show-stats
      - name: Verify Windows GPU support
        if: runner.os == 'Windows'
        run: python tests/python/run_kitchen3d_test.py --blender "$PWD/install/kitchen3d.exe" --script "$PWD/tests/python/kitchen3d_gpu_build.py" --output "$PWD/build/gpu-build"
      - name: Kitchen 3D regression tests
        run: ctest --test-dir build -C Release -L kitchen3d --output-on-failure --no-tests=error --parallel 1
      - name: Installed runtime and render smoke test
        run: |
          case '${{ matrix.platform }}' in
            windows-x64) executable="$PWD/install/kitchen3d.exe" ;;
            linux-x64) executable="$PWD/install/kitchen3d" ;;
            macos-arm64) executable="$PWD/install/Kitchen 3D.app/Contents/MacOS/Kitchen 3D" ;;
          esac
          python tests/python/run_kitchen3d_test.py --blender "$executable" \
            --script "$PWD/tests/python/kitchen3d_package_smoke.py" --output "$PWD/build/package-smoke"
      - name: Verify renamed native launcher
        if: runner.os != 'macOS'
        run: python tests/python/kitchen3d_launcher_smoke.py --install "$PWD/install"
      - name: Package tested build
        run: python build_files/kitchen3d/package.py --install install --output dist --platform '${{ matrix.platform }}' --revision "$GITHUB_SHA"
      - name: Build Windows installation wizard
        if: runner.os == 'Windows'
        run: python build_files/kitchen3d/build_installer.py --install install --output dist
      - name: Test Windows install, upgrade and uninstall
        if: runner.os == 'Windows'
        run: python tests/python/kitchen3d_installer_smoke.py --setup dist/Kitchen3D-windows-x64-setup.exe --output build/installer-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kitchen3D-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve build and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/
            build/tests/kitchen3d/
            build/package-smoke/
            build/installer-smoke/
          retention-days: 14

  source:
    name: Archive corresponding source and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify pinned downloads
        id: download-keys
        run: python3 build_files/kitchen3d/cache_keys.py >> "$GITHUB_OUTPUT"
      - name: Restore source download cache
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/lfs/objects
          key: source-lfs-v1-${{ runner.os }}-${{ steps.download-keys.outputs.source }}
          restore-keys: source-lfs-v1-${{ runner.os }}-
      - name: Restore source assets
        run: python3 build_files/kitchen3d/restore_lfs.py --upstream https://projects.blender.org/blender/blender --media-branch blender-v5.3-release --exclude-tests
      - name: Save source download cache
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/lfs/objects
          key: source-lfs-v1-${{ runner.os }}-${{ steps.download-keys.outputs.source }}
      - name: Archive fork source and checksum-verified dependency sources
        shell: bash
        run: |
          python3 build_files/kitchen3d/source_archive.py
          python3 build_files/kitchen3d/retry_download.py -- cmake -DPACKAGE_DIR="$RUNNER_TEMP/dependency-sources" -P build_files/kitchen3d/download_sources.cmake
          tar -cf - -C "$RUNNER_TEMP" dependency-sources | split -b 1024m -d - dist/Kitchen3D-dependency-sources.tar.part
          cd dist
          sha256sum Kitchen3D-source.tar.xz Kitchen3D-dependency-sources.tar.part* > SOURCE-SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kitchen3D-source
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tested downloads
    needs: [build, source]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Kitchen3D-*
          path: dist
          merge-multiple: true
      - name: Publish an immutable preview for this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          cat > notes.md <<EOF
          Kitchen 3D 5.3 Beta preview, built from $REVISION.

          Windows: download Kitchen3D-windows-x64-setup.exe for the installation wizard, shortcuts and uninstaller, or use the portable ZIP. macOS Apple Silicon: download the ZIP. Linux x64 (Ubuntu 24.04 or compatible): download the tar.xz. Extract portable archives before launching. These builds are unsigned and not notarized.

          All three platforms passed the eight Kitchen 3D background regression suites and an installed-runtime, Cycles CPU render, and save/reopen smoke test. GUI tests and the full upstream test suite are not run by this workflow. Windows includes CUDA/OptiX kernels; actual GPU rendering depends on compatible NVIDIA hardware and drivers. Linux Cycles is CPU-only; macOS retains Metal.

          This preview includes the opt-in Kitchen 3D Persistent Cycles experimental renderer and binary .REND lighting caches. It supports CPU rendering of restricted diffuse scenes via F12; GPU rendering and a live rendered viewport are not supported by this experiment. In the Python Console, run import kitchen3d_lighting; kitchen3d_lighting.register() before opening an experimental-engine project. See https://github.com/BaerBonesTechnology/kitchen-3d/blob/$REVISION/doc/kitchen3d/rend-cache.md for preparation, limitations and measured results. Keep the .REND sidecar with its .blend project.

          Windows Setup also passed installation, shortcut-target, upgrade, installed-runtime and uninstall checks. It installs for the current user and preserves user-owned files when uninstalling.

          Source and build scripts are in Kitchen3D-source.tar.xz. Download every Kitchen3D-dependency-sources.tar.partNN file and concatenate in numerical order, then extract the resulting tar to obtain dependency source packages. Checksums accompany all downloads. See build_files/kitchen3d/README.md in the source for rebuilding instructions.
          EOF
          tag="kitchen3d-build-$RUN_ID-$RUN_ATTEMPT"
          gh release create "$tag" dist/* --target "$REVISION" --title "Kitchen 3D 5.3 Beta · build $RUN_ID" --notes-file notes.md --prerelease --draft
          gh release edit "$tag" --draft=false
